plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.treetotal.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.treetotal.android"
        minSdk 24
        targetSdk 34
        versionCode 24
        versionName "0.2.14"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Signing is driven by secrets, never committed. Provide EITHER a gitignored
    // android/keystore.properties (local) OR SIGNING_* env vars (CI secrets). If
    // neither is present, builds fall back to the default debug key so CI still
    // produces an APK — those interim builds are not upgrade-stable.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def signingProps = new Properties()
    if (keystorePropsFile.exists()) {
        signingProps.load(new FileInputStream(keystorePropsFile))
    }
    def storeFilePath = signingProps.getProperty("storeFile") ?: System.getenv("SIGNING_STORE_FILE")
    def storePw = signingProps.getProperty("storePassword") ?: System.getenv("SIGNING_STORE_PASSWORD")
    def keyAliasVal = signingProps.getProperty("keyAlias") ?: System.getenv("SIGNING_KEY_ALIAS")
    def keyPw = signingProps.getProperty("keyPassword") ?: System.getenv("SIGNING_KEY_PASSWORD")
    def hasReleaseSigning = storeFilePath && file(storeFilePath).exists() && storePw && keyAliasVal && keyPw

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(storeFilePath)
                storePassword storePw
                keyAlias keyAliasVal
                keyPassword keyPw
            }
        }
    }

    buildTypes {
        // Debug is signed with the release key when one is configured, so CI
        // builds upgrade-install over an existing release install (same
        // signature). Without a configured key it uses the default debug key.
        debug {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        // java.time on minSdk 24 requires desugaring (java.time is API 26+ natively)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    buildFeatures {
        viewBinding true
    }
    
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "TreeTotal-${variant.versionName}.apk"
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
} 