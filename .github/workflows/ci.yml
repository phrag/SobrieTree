name: CI

on:
  push:
    branches: [ '**' ]
    # A v-tag cuts a real, versioned release; see the release steps at the end.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the rolling "latest" APK release
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION: 26.1.10909125
      # Release signing comes from repo secrets; absent secrets fall back to the
      # debug key so the build still succeeds (interim APKs are not upgrade-stable).
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode release keystore (if configured)
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Minimal components to build; add as needed
          packages: |
            platform-tools

      - name: Install SDK packages
        run: |
          TOOLDIR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$TOOLDIR/sdkmanager" ]; then TOOLDIR="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"; fi
          echo "y" | "$TOOLDIR/sdkmanager" --licenses > /dev/null
          "$TOOLDIR/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "cmake;3.22.1"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Build native (Rust → jniLibs)
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd rust
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android (assembleDebug)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          build-root-directory: android
          arguments: assembleDebug --no-daemon

      - name: Run Android unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          build-root-directory: android
          arguments: testDebugUnitTest --no-daemon

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --all --quiet

      - name: Rust formatting and clippy
        working-directory: rust
        run: |
          rustup component add rustfmt clippy || true
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Android Lint
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          build-root-directory: android
          arguments: lintDebug --no-daemon

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SobrieTree-apk
          path: android/app/build/outputs/apk/debug/SobrieTree-*.apk

      # Publish the built APK directly (not a login-gated zip) to a rolling
      # "latest" pre-release, so it's downloadable from the Releases page with a
      # stable URL that always points at the most recent build:
      #   https://github.com/<owner>/<repo>/releases/download/latest/SobrieTree-latest.apk
      # Only publish to the public release when a real signing key is configured,
      # so we never ship an interim debug-key-signed APK to users.
      - name: Stage a stable-named APK
        if: success() && env.SIGNING_KEYSTORE_BASE64 != ''
        run: cp android/app/build/outputs/apk/debug/SobrieTree-*.apk SobrieTree-latest.apk

      - name: Publish rolling "latest" release
        if: success() && env.SIGNING_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (auto)
          prerelease: true
          body: |
            Automatically published debug APK from the most recent CI build.

            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Direct download (always latest): https://github.com/${{ github.repository }}/releases/download/latest/SobrieTree-latest.apk
          files: |
            SobrieTree-latest.apk
            android/app/build/outputs/apk/debug/SobrieTree-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------- release
      # Pushing a v-tag cuts a real release. Unlike the rolling "latest" build
      # this is assembleRelease, so it ships with debuggable=false - a debug APK
      # lets anyone with the phone attach a debugger and read the database,
      # which is not what a privacy-first app should hand out. Both are signed
      # with the same release key, so either upgrade-installs over the other.
      - name: Build Android (assembleRelease)
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEYSTORE_BASE64 != ''
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          build-root-directory: android
          arguments: assembleRelease --no-daemon

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          name: SobrieTree ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/SobrieTree-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
